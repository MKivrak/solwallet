<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>solwallet demo</title>
<style>
  :root { color-scheme: dark light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0f1115; color: #e8eaed; padding: 24px;
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.lede { margin: 0 0 24px; color: #9aa0a6; }
  .card { border: 1px solid #2a2e37; border-radius: 14px; padding: 22px; background: #15181e; }
  button {
    font: 600 15px inherit; border-radius: 10px; padding: 12px 18px; min-height: 44px;
    border: 1px solid #2a2e37; background: #e8eaed; color: #0f1115; cursor: pointer; width: 100%;
  }
  button.ghost { background: transparent; color: #e8eaed; }
  button + button { margin-top: 9px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .addr { font: 14px ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all; color: #9aa0a6; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5f6368; }
  .dot.on { background: #34d399; }
  .log { margin: 16px 0 0; padding: 12px 14px; border-radius: 10px; background: #0f1115;
         border: 1px solid #2a2e37; font: 13px ui-monospace, Menlo, monospace; color: #9aa0a6;
         max-height: 160px; overflow: auto; white-space: pre-wrap; }
  a { color: #8ab4f8; }
</style>
</head>
<body>
<main>
  <h1>solwallet</h1>
  <p class="lede">Connect a Solana wallet with no dependencies and no build step.</p>

  <div class="card">
    <div class="row">
      <span class="dot" id="dot"></span>
      <strong id="status">Not connected</strong>
    </div>
    <p class="addr" id="addr">—</p>
    <div id="actions"></div>
    <div class="log" id="log" hidden></div>
  </div>

  <p class="lede" style="margin-top:18px;font-size:14px">
    Nothing is sent anywhere. Everything here happens in your browser, and the
    page never asks for a transaction.
  </p>
</main>

<script type="module">
import { wallet, available, installLinks } from './solwallet.js';

const $ = (id) => document.getElementById(id);
const log = (line) => {
  const box = $('log');
  box.hidden = false;
  box.textContent += (box.textContent ? '\n' : '') + line;
  box.scrollTop = box.scrollHeight;
};

const button = (label, onClick, ghost = false) => {
  const b = document.createElement('button');
  b.textContent = label;
  if (ghost) b.className = 'ghost';
  b.addEventListener('click', onClick);
  return b;
};

function render() {
  const actions = $('actions');
  actions.replaceChildren();

  if (wallet.connected) {
    $('dot').classList.add('on');
    $('status').textContent = 'Connected with ' + wallet.walletName;
    $('addr').textContent = wallet.publicKey;

    actions.append(button('Sign a message', async () => {
      try {
        const signature = await wallet.signMessage('Hello from solwallet');
        log('signed, ' + signature.length + ' bytes');
      } catch (e) {
        log('sign failed: ' + e.message);
      }
    }));
    actions.append(button('Disconnect', () => wallet.disconnect(), true));
    return;
  }

  $('dot').classList.remove('on');
  $('status').textContent = 'Not connected';
  $('addr').textContent = '—';

  const found = available();
  if (!found.length) {
    const p = document.createElement('p');
    p.className = 'lede';
    p.style.margin = '0 0 12px';
    p.textContent = 'No Solana wallet found in this browser. Install one:';
    actions.append(p);
    for (const { name, url } of installLinks()) {
      if (!url) continue;
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = name;
      a.style.marginRight = '12px';
      actions.append(a);
    }
    return;
  }

  for (const { id, name } of found) {
    actions.append(button('Connect ' + name, async () => {
      try {
        await wallet.connect(id);
      } catch (e) {
        log(e.code ? e.code + ': ' + e.message : e.message);
      }
    }));
  }
}

wallet.onChange(({ publicKey, reason }) => {
  log(reason + (publicKey ? ' → ' + publicKey.slice(0, 8) + '…' : ''));
  render();
});

// reconnect silently if this browser already trusts the page
wallet.resume().then((key) => { if (key) log('resumed a trusted session'); });
</script>
</body>
</html>
